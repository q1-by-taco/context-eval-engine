[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q1-context-eval"
version = "1.0.0"
description = "Production-Grade Context Engineering Engine, MCP Server & Evidence-First Evaluation Harness for Frontier LLMs"
readme = "README.md"
authors = [
  { name = "Marcio Krefta" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["context-engineering", "mcp", "llm-evaluation", "model-context-protocol", "prompt-optimization", "google-antigravity", "gemini"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/q1-by-taco/context-eval-engine"
Documentation = "https://github.com/q1-by-taco/context-eval-engine#readme"
Repository = "https://github.com/q1-by-taco/context-eval-engine.git"
Issues = "https://github.com/q1-by-taco/context-eval-engine/issues"
Organization = "https://github.com/q1-by-taco"

[project.scripts]
context-eval = "src.server:main"
